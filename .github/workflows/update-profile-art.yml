name: Profil grafiklerini güncelle

on:
  schedule:
    - cron: "17 6 * * *"   # her gün ~06:17 UTC (09:17 TR)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py ${{ github.repository_owner }} data/contributions.json
      - run: python scripts/render_heatmap_svg.py data/contributions.json contrib-heatmap.svg
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: katkı haritası güncellendi [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
